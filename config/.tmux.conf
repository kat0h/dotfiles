# ステータスバーを5秒毎に描画し直す
set-option -g status-interval 5

bind c new-window -c '#{pane_current_path}'

# | でペインを縦に分割する
bind | split-window -h -c '#{pane_current_path}'

# - でペインを横に分割する
bind - split-window -v -c '#{pane_current_path}'

#prefixキー
set -g prefix C-t

# C-t*2でtmux内のプログラムにC-tを送る
bind C-t send-prefix

# キーストロークのディレイを減らす
set -sg escape-time 1

# ステータスバーをトップに配置する
set-option -g status-position top

# 見た目（kanagawa-paper ink に合わせる。アイコンは Nerd Font）
set-option -g status-style "bg=#2A2A37,fg=#9e9b93"
# 左：セッション名
set-option -g status-left-length 30
set-option -g status-left "#[bg=#c4b28a,fg=#1F1F28,bold]  #S #[default] "
# ウィンドウ一覧：選択中のものだけ明るくする
set-option -g window-status-format " #I #W "
set-option -g window-status-current-format "#[bg=#1F1F28,fg=#c4b28a,bold] #I #W "
set-option -g window-status-separator ""
# 右：日付と時刻
set-option -g status-right "#[fg=#698a9b] %m/%d(%a)  #[fg=#c4b28a] %H:%M "
# ペインの境界線、メッセージ、コピーモードの選択範囲
set-option -g pane-border-style "fg=#363646"
set-option -g pane-active-border-style "fg=#698a9b"
set-option -g message-style "bg=#2A2A37,fg=#c4b28a"
set-option -g mode-style "bg=#363646,fg=#DCD7BA"

# コピーモードを設定する
# コピーモードでvimキーバインドを使う
setw -g mode-keys vi

# 'v' で選択を始める
bind -T copy-mode-vi v send -X begin-selection
# 'V' で行選択
bind -T copy-mode-vi V send -X select-line
# 'C-v' で矩形選択
bind -T copy-mode-vi C-v send -X rectangle-toggle
# 'y' でヤンク
bind -T copy-mode-vi y send -X copy-selection
# 'Y' で行ヤンク
bind -T copy-mode-vi Y send -X copy-line

# vimのキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vimのキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g mouse on
setw -g alternate-screen on

# Claude Codeのフォーカス検知（通知制御）に必要
set -g focus-events on

set-option -g default-terminal "tmux-256color" # 基本的にはscreen-256colorかtmux-256colorを設定
set-option -ga terminal-overrides ",$TERM:Tc" # tmuxを起動していない時のzshでの$TERMの値を指定
