# Umbriel session configured to match the current Hyprland workflow.
# Keep Qt theme and scale overrides out of this session: Qt's defaults are
# already 1x, and QT_QPA_PLATFORMTHEME/QT_STYLE_OVERRIDE previously damaged
# the KDE/Qt appearance when they leaked into another session.

[general]
mod_key = "Super"
xwayland = true
show_cheatsheet = false
focus_on_activate = false
honor_restored_maximize = false
autostart = [
    "fcitx5 --replace -d",
    "noctalia --daemon",
    # polkit-kde's autostart entry is OnlyShowIn=KDE, so start the auth agent explicitly.
    "/usr/libexec/kf6/polkit-kde-authentication-agent-1",
    # Give the portal and D-Bus-activated KDE services the session environment.
    "dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_MENU_PREFIX && systemctl --user start --job-mode=ignore-dependencies xdg-desktop-portal.service",
    # Disable the internal panel only while the Dell U2725QE is connected.
    '''sh -c 'last=; check() { if umbriel outputs | grep -qi U2725QE; then s=off; else s=on; fi; [ "$s" = "$last" ] && return; last=$s; if [ "$s" = off ]; then umbriel msg output-disable:eDP-1; else umbriel msg output-enable:eDP-1; fi; }; check; umbriel subscribe outputs | while read -r _; do check; done' ''',
]

[environment]
XCURSOR_SIZE = "24"
HYPRCURSOR_SIZE = "24"
# KDE apps and portal-kde need this to find plasma-applications.menu ("Open with" list).
XDG_MENU_PREFIX = "plasma-"
XMODIFIERS = "@im=fcitx"
QT_IM_MODULE = "fcitx"
SDL_IM_MODULE = "fcitx"
QT_QPA_PLATFORM = "wayland;xcb"
QT_WAYLAND_DISABLE_WINDOWDECORATION = "1"

[input]
middle_click_paste = true
window_drag_toggle = "none"

[input.keyboard]
layout = "us"
variant = ""
options = ""
repeat_rate = 60
repeat_delay = 350
numlock_toggle = false
track_layout = "global"

[input.touchpad]
tap = true
natural_scroll = true

[input.mouse]
sensitivity = 0.0

[input.cursor]
size = 24
hardware_cursor = true
follows_focus = false
hide_when_typing = false

[input.focus]
# Hovering also raises windows; switch to hover_raises = false once the
# installed build supports it (not in the 2026-10-22 nightly).
follows_mouse = false

[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 20
drag_opacity = 1.0

[appearance.blur]
enabled = false

[appearance.title_bar]
mode = "on"

[appearance.shadow]
enabled = true
softness = 4
offset_x = 0
offset_y = 0

[layout]
mode = "floating"
gap = 5
extent_presets = [0.333, 0.5, 0.667]

[layout.dwindle]
preserve_split = true

[workspaces]
back_and_forth = false
empty_above = false

# Arrange the laptop's workspaces top-to-bottom.
# [output.eDP-1]
# workspace_axis = "vertical"

# Its preferred mode is 60 Hz.
[output."Dell Inc. DELL U2725QE D7S5734"]
mode = "3840x2160@120"

[keybinds]
# Applications and Noctalia
"Mod+Return" = { action = "spawn:kitty", repeat = false }
"Mod+Shift+Q" = { action = "window-close", repeat = false }
"Mod+M" = { action = "spawn:noctalia msg panel-toggle session", repeat = false }
"Mod+E" = { action = "spawn:dolphin", repeat = false }
"Mod+V" = { action = "window-toggle-floating", repeat = false }
"Mod+D" = { action = "spawn:noctalia msg panel-toggle launcher", repeat = false }
"Mod+Shift+F" = "window-toggle-fullscreen"
"Mod+Comma" = { action = "spawn:noctalia msg settings-toggle", repeat = false }
"Mod+Tab" = { action = "spawn:noctalia msg window-switcher hold", repeat = false }

# Screenshots and Japanese input toggle
"Print" = { action = "spawn:noctalia msg screenshot-fullscreen", repeat = false }
"Shift+Print" = { action = "spawn:noctalia msg screenshot-region", repeat = false }
"Mod+Shift+S" = { action = "spawn:noctalia msg screenshot-region", repeat = false }
"Alt+Print" = { action = "spawn:noctalia msg screenshot-annotate", repeat = false }
"Ctrl+Space" = { action = "spawn:fcitx5-remote -t", repeat = false }

# Focus, move, and resize with Vim keys
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+J" = "window-move-down"
"Mod+Shift+K" = "window-move-up"
"Mod+Shift+L" = "column-move-right"
"Mod+Ctrl+H" = { action = "window-modify-width-right:-0.1", repeat = true }
"Mod+Ctrl+J" = { action = "window-modify-height-down:0.1", repeat = true }
"Mod+Ctrl+K" = { action = "window-modify-height-down:-0.1", repeat = true }
"Mod+Ctrl+L" = { action = "window-modify-width-right:0.1", repeat = true }
"Mod+Alt+J" = { action = "layout-toggle-split", repeat = false }
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"

# Workspaces: 0 is workspace 10, as in the Hyprland config.
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+0" = "workspace-switch:10"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"
"Mod+Shift+0" = "window-move-to-workspace:10"
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }

# Official Umbriel default scratchpad workflow.
"Mod+Shift+Space" = "window-move-to-scratchpad"
"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = "window-restore-from-scratchpad"
"Alt+Tab" = "scratchpad-focus-next"

# Media, brightness, and player controls
"XF86AudioRaiseVolume" = { action = "spawn:noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true }
"XF86AudioMicMute" = { action = "spawn:noctalia msg mic-mute", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn:noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:noctalia msg brightness-down", allow_when_locked = true }
"XF86AudioNext" = { action = "spawn:playerctl next", allow_when_locked = true }
"XF86AudioPause" = { action = "spawn:playerctl play-pause", allow_when_locked = true }
"XF86AudioPlay" = { action = "spawn:playerctl play-pause", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn:playerctl previous", allow_when_locked = true }

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1080, height = 920 }

[animation]
enabled = true
duration_ms = 250
curve = "easeout"

