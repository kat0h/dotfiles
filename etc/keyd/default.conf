[ids]
*

[main]
henkan = overload(control, hangeul)
muhenkan = overload(control, hanja)
hangeul = overload(control, hangeul)
hanja = overload(control, hanja)
leftcontrol = layer(recontrol)
capslock = layer(recontrol)

[recontrol:C]
p = up
n = down
f = right
b = left
h = backspace
e = end
a = home
i = tab
